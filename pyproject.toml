[project]
name = "jbomohi-tools"
version = "0.1.0"
description = "Deterministic tools for building the jbomo'i historical corpus"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
jbomohi = "jbomohi_tools.cli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-root = "tools"

[tool.ruff.lint.isort]
# Which imports are ours must not depend on where ruff is invoked from. Run
# from the repository root, ruff finds no `jbomohi_tools` package in its src
# root and sorts it beside pytest; run from `tools/`, it is first-party and
# needs its own block, so the same tree is clean from one directory and reports
# 21 I001 errors from the other. Naming it settles the question everywhere.
known-first-party = ["jbomohi_tools"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
addopts = "-ra"

[tool.jbomohi.dependency-reasons]
uv-build = "PEP 517 build backend required to install the tools package and CLI with uv."
pytest = "Test runner required by the M0 acceptance command `uv run pytest`."
ruff = "Static lint and formatting checks required by the tools-branch CI contract."
