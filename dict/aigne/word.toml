[[etymology]]
id = 360
lang = "en"
author = "krtisfranks"
updated = "2014-03-11T02:57:56Z"
content = "Based entirely on the prefix \"eigen-\" from German meaning \"own, inherent, proper, possessive, particular, special\"; converted to Lojban orthography and then having the final two phonemes exchanged so as to morphologically and phonotactically become a valid fu'ivla in a simple manner.  Usage as in English mathematical and physics contexts. See also: {jinzi}."
