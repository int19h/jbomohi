[[etymology]]
id = 188
lang = "en"
author = "daniel"
updated = "2010-05-26T02:01:20Z"
content = "The creator of a zi'evla is free to choose any place structure at all, and any word form as long as it is morphologically valid. In contrast, when coining lujvo, the place structure is limited by, e.g., jvajvo, and the word form is limited by the relevant rafsi."
