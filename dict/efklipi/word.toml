[[etymology]]
id = 1603
lang = "en"
author = "krtisfranks"
updated = "2021-02-01T07:52:08Z"
content = "\".efkli\" from Greek (transcribed) \"Euclid\" which is, in modern (but not necessarily ancient) dialects, pronounced approximately as (IPA) /εf.klid/; + \"pi\" from {pritu}, referencing the \"right\" moniker. Notice that \"pi\" is just a nod to this convention; there is no cultural assumption here about the order of writing, the meaning of \"right\", etc."
