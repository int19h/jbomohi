[[etymology]]
id = 1710
lang = "en"
author = "krtisfranks"
updated = "2022-11-18T21:31:20Z"
content = "\"ronto\" (SI prefix) + the ending of {zepti} and {gocti} (which preserves the \"t\" but normalizes the final vowel to \"i\", which is the standard for Lojbanic SI prefixes for negative powers). This word preserves the English/French SI, and thus numerical, pattern of using the Latin or Greek words for n (here 9) in the 10^(3n) which is represented by the prefix, here \"non-\" and \"ennea-\"."
