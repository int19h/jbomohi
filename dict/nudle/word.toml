content = "Eng: noodle | Mandarin: 麵條 | Hindi: नूडल | Spanish: pasta | Russian: лапша́ | Arabic:\tمعكرونة\r\n\r\nOriginal etymology is likely a Lojbanization of \"noodle\"; however, the gismu may be derived retroactively by inputting the above source words into gimyzba using the order [Eng, Man, Hin, Spa, Rus, Ara]. The result gives \"nudla\" as a 1st candidate, \"nudli\" as a 2nd, and \"nudle\" as 3rd."
