[[etymology]]
id = 613
lang = "en"
author = "krtisfranks"
updated = "2014-12-25T09:23:16Z"
content = "Eponym of genius, architect, and engineer Brunelleschi who implemented such a pattern in his famous dome. The final \"-a\" is added in order to denote derivation from his name (much like \"-an\" in \"Brunelleschian\" in English) and to avoid having the form of GISMUGISMU, which would have worked but could potentially have been confusing if future gismu are made."
