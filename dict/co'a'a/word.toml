[[etymology]]
id = 1579
lang = "en"
author = "blamaa"
updated = "2020-12-05T11:04:18Z"
content = "The mirror image of {co'u'a}. {co'u'a} seems to have been formed by adding {'a} to {co'u}. It takes us from the ending point of an action to before its natural ending point. Therefore, {co'a} adds {'a} to {co'a}. This takes us from the beginning of the action to past its natural beginning point."
