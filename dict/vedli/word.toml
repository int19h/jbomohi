[[etymology]]
id = 255
lang = "en"
author = "gleki"
updated = "2013-03-23T12:06:10Z"
content = "Proto-Indo-European \"weid\" is glossed as \"to see, to know\". Sanskrit: \"veda\" - to know in the sense of \"to feel\" (hard to explain actually, they just had several words for \"know\"). Given that \"to see\" is polysemous in natlangs and can often intersect with other senses this *might* be the right etymology for {vedli}. Mnemonics: Veda, Ayurveda etc. Russian verb \"vedat'\" still used however seldom. \"li\" - is from mandarin. the same etymology as for {lifri}."
