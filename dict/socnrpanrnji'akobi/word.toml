[[etymology]]
id = 1721
lang = "en"
author = "krtisfranks"
updated = "2023-02-15T17:22:30Z"
content = "German name \"Jacobi\". Given that Jacobi was German, the first sound was probably /j/ (on-glide \"i\" in Lojban), not /Z/ or /dZ/ (both X-SAMPA; rendered as \"j\" and \"dj\" in Lojban, respectively) or similar, \"iakobi\" would be the appropriate Lojbanization. However, phonotactics requires a leading consonant and a resultant syllable break, so I split the difference and went with \"ji'akobi\"."
