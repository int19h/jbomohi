[[etymology]]
id = 1750
lang = "en"
author = "krtisfranks"
updated = "2023-12-03T21:04:44Z"
content = "From Wiradjuri \"biladurang\", which names the same animal. Wiradjuri was/is spoken in the region in which the European scientific community (and thus wider world) first encountered the platypus and is a member of the Pama-Nyungan language family, which is the most-widespread and most commonly spoken language family among Australian Aboriginal languages, making it a good compromise between indigenous and global terminology."
