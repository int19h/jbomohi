author = "krtisfranks"
updated = "2019-11-17T18:48:14Z"
content = "\"Haudenosaunee\" (endonym), which is pronounced roughly as \"xodynoconi\" in Lojbanic form; the schwa was removed in order to generate a consonant cluster and the final vowel sequence was replaced with \"o\", as is typical for cultural brivla in Lojban."
