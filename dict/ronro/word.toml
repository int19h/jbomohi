content = "\"ronna\" (SI prefix) + matching the ending of {zetro} and {gotro} (in particular: Lojban words for SI prefixes for positive powers end in \"-o\"). This word  oreserves the pattern of translating the English/French SI prefix's first syllable very closely, which in turn preserves the numeric pattern."
