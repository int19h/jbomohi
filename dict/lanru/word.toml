[[etymology]]
id = 1267
lang = "en"
author = "viktor"
updated = "2017-06-30T02:49:23Z"
content = "Latin-English \"lantern\" and European cognates of it; word play on the gismu \"lunra\" as the moon is like a lantern in the sky (\".i le lunra cu lanru pe'a\")"

[[etymology]]
id = 1277
lang = "eo"
author = "viktor"
updated = "2017-06-30T15:40:20Z"
content = "Latina-Angla \"lantern\" kaj Eŭropaj kognatoj de ĝi; vortludo pri la gismu \"lunra\" kiel la luno estas kiel lanterno en la ĉielo (\".i le lunra cu lanru pe'a\")"
