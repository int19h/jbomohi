[[etymology]]
id = 1609
lang = "en"
author = "krtisfranks"
updated = "2021-02-07T00:36:27Z"
content = "{critu} + {vensa}; the \"oi\" comes from \"u\" (\"critu\") + \"(v)e\" (\"vensa\"). Alternatived considered were *\"critfensa\" (ill-formed), \"crituuensa\" (more syllables, thus breaking the pattern), \"critu'ensa\" (similar to last but worse; lacks the allusion to \"v\" that the last had), and \"criteunsa\" (uses currently-impermissible diphthong/vowel cluster). /u.e/ evolving into /oi/ does not strain credibility."
