content = "This is a rather funny joke we came up with one night in #lojban. We were playing a word game (now dubbed the nickel-dog game), and we decided that this would make a hilarious lujvo after a cnino by the name of \"harblcat\" made several plays involving 'le nikle gerku'. The progressing story got silly enough to warrant this lujvo, and it was generally agreed that nobody in their right mind would ever need a lujvo 'nikle zei gerku' for any reason."
