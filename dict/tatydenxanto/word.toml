content = "Eng./Modern Latin (1813) \"mastodon\" from Greek \"mastos\" (\"breast\") + \"odont\" (\"tooth\") inspired by the nipple-shaped projections on the crown of the molars; lujvo for \"breast-tooth-elephant\"."
