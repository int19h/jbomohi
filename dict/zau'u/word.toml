content = "{zmadu} + \"-u\" in order to reduplicate and be opposite of {mei'a}. Moreover, {mu} is greater than {pa} (the general pattern for PA initially is that each \"-u\" number is the end of a sequence which began with a \"-a\" number, which is lesser)."
