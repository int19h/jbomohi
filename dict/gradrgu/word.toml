[[etymology]]
id = 1722
lang = "en"
author = "krtisfranks"
updated = "2023-03-02T05:17:39Z"
content = "\"[C]u\" is a common strategy for Lojbanizing the basic consonantal lerfu C of Lojban when in zevla such that the corresponding \"[C]y\" would not work (for example: regular ISO code zevla); thus, \"gu\" refers to \"g\", which will continue to be the symbol for gravity in Lojban (as in English and other languages)."
